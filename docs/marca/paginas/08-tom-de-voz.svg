<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
<title>08 Tom de voz</title>
<rect width="1440" height="1024" fill="#F7F2EA"/>
<text x="96" y="290" font-family="Figtree" font-size="26" font-weight="500" fill="#1E2A33"><tspan x="96" dy="0.0">Falamos como um amigo bem informado: explica o que aconteceu, mostra a fonte e deixa</tspan><tspan x="96" dy="36.4">a conclusão com a pessoa.</tspan></text><text x="96" y="430" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#0F766E" text-anchor="start" letter-spacing="1.4" >FAÇA</text><text x="744" y="430" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#D4603F" text-anchor="start" letter-spacing="1.4" >EVITE</text><rect x="96" y="450" width="620" height="120" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><rect x="96" y="450" width="6" height="120" rx="3" fill="#0F766E" /><text x="128" y="500" font-family="Figtree" font-size="19" font-weight="500" fill="#1E2A33"><tspan x="128" dy="0.0">“Deputada Fulana votou Sim. A proposta foi aprovada por</tspan><tspan x="128" dy="26.6">312 a 141.”</tspan></text><rect x="744" y="450" width="600" height="120" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><rect x="744" y="450" width="6" height="120" rx="3" fill="#D4603F" /><text x="776" y="500" font-family="Figtree" font-size="19" font-weight="500" fill="#66707A"><tspan x="776" dy="0.0">“Fulana traiu o povo de novo!”</tspan></text><rect x="96" y="590" width="620" height="120" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><rect x="96" y="590" width="6" height="120" rx="3" fill="#0F766E" /><text x="128" y="640" font-family="Figtree" font-size="19" font-weight="500" fill="#1E2A33"><tspan x="128" dy="0.0">“PEC é uma mudança na Constituição. Precisa de 3/5 dos</tspan><tspan x="128" dy="26.6">votos.”</tspan></text><rect x="744" y="590" width="600" height="120" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><rect x="744" y="590" width="6" height="120" rx="3" fill="#D4603F" /><text x="776" y="640" font-family="Figtree" font-size="19" font-weight="500" fill="#66707A"><tspan x="776" dy="0.0">“Proposta de Emenda Constitucional nos termos do art.</tspan><tspan x="776" dy="26.6">60.”</tspan></text><rect x="96" y="730" width="620" height="120" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><rect x="96" y="730" width="6" height="120" rx="3" fill="#0F766E" /><text x="128" y="780" font-family="Figtree" font-size="19" font-weight="500" fill="#1E2A33"><tspan x="128" dy="0.0">“Esteve em 32 das 40 votações. Faltas podem ter</tspan><tspan x="128" dy="26.6">justificativa.”</tspan></text><rect x="744" y="730" width="600" height="120" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><rect x="744" y="730" width="6" height="120" rx="3" fill="#D4603F" /><text x="776" y="780" font-family="Figtree" font-size="19" font-weight="500" fill="#66707A"><tspan x="776" dy="0.0">“Ausente e preguiçoso: veja quem mais falta!”</tspan></text><text x="96" y="920" font-family="Figtree" font-size="18" font-weight="600" fill="#1D4E89" text-anchor="start" letter-spacing="0" >Frases curtas · voz ativa · sempre com a fonte · nunca adjetivar políticos · explicar sigla na primeira vez</text>
<text x="96" y="64" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#66707A" text-anchor="start" letter-spacing="1.4" >MANUAL DE MARCA · PLENÁRIO</text><text x="1344" y="64" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#66707A" text-anchor="end" letter-spacing="1.4" >08 / 09</text>
<text x="96" y="150" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#1D4E89" text-anchor="start" letter-spacing="1.6" >TOM DE VOZ</text><text x="96" y="214" font-family="Bricolage Grotesque" font-size="56" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="-1.2" >Como o Plenário fala</text>
</svg>