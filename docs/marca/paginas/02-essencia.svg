<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
<title>02 Essência</title>
<rect width="1440" height="1024" fill="#F7F2EA"/>
<text x="96" y="300" font-family="Figtree" font-size="26" font-weight="500" fill="#1E2A33"><tspan x="96" dy="0.0">O Plenário aproxima as pessoas da vida</tspan><tspan x="96" dy="36.4">política. Mostra, com dados oficiais e em</tspan><tspan x="96" dy="36.4">linguagem simples, como votam, se trabalham e</tspan><tspan x="96" dy="36.4">quanto gastam os políticos que cada um elegeu.</tspan></text><text x="96" y="560" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#66707A" text-anchor="start" letter-spacing="1.4" >PROPÓSITO</text><text x="96" y="596" font-family="Bricolage Grotesque" font-size="22" font-weight="700" fill="#1D4E89"><tspan x="96" dy="0.0">Que acompanhar a política seja tão natural</tspan><tspan x="96" dy="29.7">quanto acompanhar o próprio time.</tspan></text><text x="800" y="280" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#66707A" text-anchor="start" letter-spacing="1.4" >PERSONALIDADE</text><rect x="800" y="320" width="544" height="92" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><text x="828" y="360" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="0" >Confiável</text><text x="828" y="390" font-family="Figtree" font-size="17" font-weight="400" fill="#66707A" text-anchor="start" letter-spacing="0" >Mostra a fonte de cada número.</text><rect x="800" y="428" width="544" height="92" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><text x="828" y="468" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="0" >Apartidária</text><text x="828" y="498" font-family="Figtree" font-size="17" font-weight="400" fill="#66707A" text-anchor="start" letter-spacing="0" >Trata todos os partidos do mesmo jeito.</text><rect x="800" y="536" width="544" height="92" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><text x="828" y="576" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="0" >Acolhedora</text><text x="828" y="606" font-family="Figtree" font-size="17" font-weight="400" fill="#66707A" text-anchor="start" letter-spacing="0" >Explica sem julgar quem sabe pouco.</text><rect x="800" y="644" width="544" height="92" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><text x="828" y="684" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="0" >Brasileira</text><text x="828" y="714" font-family="Figtree" font-size="17" font-weight="400" fill="#66707A" text-anchor="start" letter-spacing="0" >Nasce dos símbolos e do modernismo de Brasília.</text><rect x="800" y="752" width="544" height="92" rx="20" fill="#FFFDF9" stroke="#E6DDD0" stroke-width="1" /><text x="828" y="792" font-family="Bricolage Grotesque" font-size="24" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="0" >Direta</text><text x="828" y="822" font-family="Figtree" font-size="17" font-weight="400" fill="#66707A" text-anchor="start" letter-spacing="0" >Frases curtas, sem juridiquês.</text><text x="96" y="900" font-family="Figtree" font-size="18" font-weight="600" fill="#0F766E" text-anchor="start" letter-spacing="0" >É · próxima, clara, séria quando precisa</text><text x="96" y="932" font-family="Figtree" font-size="18" font-weight="600" fill="#D4603F" text-anchor="start" letter-spacing="0" >Não é · torcida, sarcasmo, opinião sobre candidatos</text>
<text x="96" y="64" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#66707A" text-anchor="start" letter-spacing="1.4" >MANUAL DE MARCA · PLENÁRIO</text><text x="1344" y="64" font-family="IBM Plex Mono" font-size="13" font-weight="500" fill="#66707A" text-anchor="end" letter-spacing="1.4" >02 / 09</text>
<text x="96" y="150" font-family="IBM Plex Mono" font-size="14" font-weight="500" fill="#1D4E89" text-anchor="start" letter-spacing="1.6" >ESSÊNCIA</text><text x="96" y="214" font-family="Bricolage Grotesque" font-size="56" font-weight="800" fill="#1E2A33" text-anchor="start" letter-spacing="-1.2" >Quem é o Plenário</text>
</svg>